[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reference-check-agent-backend"
version = "0.1.0"
description = "Deterministic citation and reference checking backend"
requires-python = ">=3.9"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.116,<1",
  "olefile>=0.47,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-defusedxml>=0.7.0.20250822,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP006", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.9"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
